name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '33 3 * * *'
jobs:
  macOS-minimal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-26, xcode-27]
    steps:
    - uses: actions/checkout@v7
    - uses: ./
      with:
        cvmfs_repositories: 'sft.cern.ch'
    - name: Test CernVM-FS
      run: |
       echo "### Dump default.local ###"
       cat /etc/cvmfs/default.local
       echo "### Mounts ###"
       mount | grep cvmfs
       cvmfs_config stat
       echo "### Try to ls on /Users/Shared/cvmfs/sft.cern.ch/ ###"
       ls /Users/Shared/cvmfs/sft.cern.ch/ | grep lcg
       echo "### Try to ls on /cvmfs/sft.cern.ch/ ###"
       ls /cvmfs/sft.cern.ch/ | grep lcg
